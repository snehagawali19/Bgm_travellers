services:
  db:
    image: postgres:16-alpine
    container_name: bgm-travels-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgm
      POSTGRES_PASSWORD: bgm_dev_password
      POSTGRES_DB: bgm_travels
    ports:
      - "5432:5432"
    volumes:
      - bgm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgm -d bgm_travels"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    container_name: bgm-travels-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgm
      POSTGRES_PASSWORD: bgm_dev_password
      POSTGRES_DB: bgm_travels_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgm -d bgm_travels_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bgm_pgdata:
