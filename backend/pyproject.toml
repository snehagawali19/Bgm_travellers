[project]
name = "bgm-travels-api"
version = "0.1.0"
description = "BGM Travels bus booking API"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.38",
  "alembic==1.14.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.4",
  "email-validator==2.2.0",
  "python-multipart==0.0.20",
  "bcrypt==4.2.1",
  "itsdangerous==2.2.0",
  "razorpay==1.4.2",
  "httpx==0.28.1",
  "slowapi==0.1.9",
  "qrcode==8.0",
  "Pillow==11.1.0",
  "setuptools==75.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
